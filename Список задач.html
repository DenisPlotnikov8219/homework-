
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Список задач</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f5f5f5;
    }

    h1 {
      color: #483c3c;
    }

    ul.task-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li.task-item {
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    li.task-item:nth-child(odd) {
      background-color: #e0f7fa; 
    }
    li.task-item:nth-child(even) {
      background-color: #b2ebf2; 
    }
    li.task-item.completed {
      background-color: #e2d9f2 !important; 
      color: #1a16ef;
    }
    li.task-item.completed span.task-text {
      text-decoration: line-through;
    }

    .task-icon {
      font-size: 25px;
    }

    .remove-btn {
      margin-left: auto;
      cursor: pointer;
      color: #1a0202;
      font-weight: bold;
      transition: opacity 0.2s;
    }
    .remove-btn:hover {
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <h1>My To Do List</h1>
  <ul class="task-list">
    <li class="task-item">
      <span class="task-icon">☐</span>
      <span class="task-text">Hit the gym</span>
      
      <span class="remove-btn">✖</span>
    </li>
    <li class="task-item completed">
      <span class="task-icon">☑</span>
      <span class="task-text">Pay bills</span>
      <span class="remove-btn">✖</span>
    </li>
    <li class="task-item">
      <span class="task-icon">☐</span>
      <span class="task-text">Meet John</span>
      <span class="remove-btn">✖</span>
    </li>
    <li class="task-item completed">
      <span class="task-icon">☑</span>
      <span class="task-text">Buy eggs</span>
      <span class="remove-btn">✖</span>
    </li>
    <li class="task-item">
      <span class="task-icon">☐</span>
      <span class="task-text">Eat Dinner</span>
      <span class="remove-btn">✖</span>
    </li>
    <li class="task-item">
      <span class="task-icon">☐</span>
      <span class="task-text">Organize office</span>
      <span class="remove-btn">✖</span>
    </li>
    <li class="task-item completed">
      <span class="task-icon">☐</span>
      <span class="task-text">Meet George</span>
      <span class="remove-btn">✖</span>
    </li>
    <li class="task-item">
      <span class="task-icon">☐</span>
      <span class="task-text">Feed the cat</span>
      <span class="remove-btn">✖</span>
    </li>
    <li class="task-item completed">
      <span class="task-icon">☑</span>
      <span class="task-text">Write a letter</span>
      <span class="remove-btn">✖</span>
    </li>
    <li class="task-item">
      <span class="task-icon">☐</span>
      <span class="task-text">Run  1 km</span>
      <span class="remove-btn">✖</span>
    
    </li>
  </ul>
</body>
</html>
