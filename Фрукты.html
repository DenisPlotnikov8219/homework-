<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список фруктов</title>
    <style>
        body {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif, Times, serif, sans-serif;
            background-color: #f66c6c;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 50px;
        }
        .fruit-list {
            list-style-type: none; 
            padding: 0;
            margin: 0;
            width: 300px;
            background-color: #f26ff47f; 
            border: 2px solid #ec0e28; 
            border-radius: 8px;
        }
        .fruit-item {
            padding: 15px 20px;
            margin: 2px 10 10 10;
            background-color: #f46096; 
            border-bottom: 1px solid #f32512;
        }
        .text-highlight {
            background-color: #f60a0a; 
            color: rgba(242, 37, 225, 0.749); 
            padding: 2px 6px; 
            border-radius: 54px;
        }
    </style>
</head>
<body>
    <ul class="fruit-list">
        <li class="fruit-item">
            <span class="text-highlight">Apple</span>
        </li>
        <li class="fruit-item">Orange</li>
        <li class="fruit-item">Pineapple</li>
        <li class="fruit-item">Pear</li>
        <li class="fruit-item">Cherry</li>
    </ul>
</body>
</html>
